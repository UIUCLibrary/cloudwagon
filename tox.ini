[tox]
envlist = py{310,311}
isolated_build = true

[tool:pytest]
addopts = --verbose

; ======================== tests ========================
dependency_groups = test
whitelist_externals = pytest
commands =  pytest --basetemp={envtmpdir} {env:pytest_args:} {posargs}

[testenv:mypy]
dependency_groups = type-check

skip_install=True
setenv = MYPY_CACHE_DIR = {temp_dir}/.mypy_cache
commands = mypy {posargs: src/backend/speedcloud}

[testenv:flake8]
description = check the code style
dependency_groups = code-style
skip_install=True
commands = flake8 {posargs: src/backend/speedcloud}


[testenv:pylint]
description = check the code style
dependency_groups = lint
skip_install=True
commands =  pylint {posargs: src/backend/speedcloud} --disable import-error

[testenv:pydocstyle]
skip_install = true
dependency_groups = code-style
commands =
    pydocstyle {posargs: {toxinidir}/src/backend/speedcloud}
[testenv:bandit]
dependency_groups = security
deps=
    bandit
commands =
    bandit {posargs: --recursive {toxinidir}/src/backend/speedcloud}

[testenv:ruff]
skip_install = true
dependency_groups = lint
commands =
    ruff check {posargs: {toxinidir}/src/backend/speedcloud}
